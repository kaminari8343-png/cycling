<title>あと何回</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho:wght@700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* Layout: a single column; the evening as a strip of half-hour blocks, the scene, the choices, then the "later" list like a sticky note at the bottom. */
  :root {
    --bg: #eef1ef;
    --card: #f8faf9;
    --fg: #22302c;
    --muted: #6b7a75;
    --line: #c9d2ce;
    --kid: #3b5794;
    --accent: #2f6a5d;
    --on-accent: #f4f7f6;
    --note: #f3ecd2;
    --note-fg: #5b4a1c;
    --night: rgba(18, 28, 40, 0.55);
    --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    --font-kid: "Klee One", "Hiragino Maru Gothic ProN", "Zen Kaku Gothic New", sans-serif;
    --font-title: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151b1a; --card: #1d2624; --fg: #dce4e1; --muted: #8d9c97; --line: #2f3b38;
      --kid: #a3b8ea; --accent: #6fb2a2; --on-accent: #0f1715;
      --note: #33301f; --note-fg: #e3d6a6; --night: rgba(0, 0, 0, 0.6); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151b1a; --card: #1d2624; --fg: #dce4e1; --muted: #8d9c97; --line: #2f3b38;
    --kid: #a3b8ea; --accent: #6fb2a2; --on-accent: #0f1715;
    --note: #33301f; --note-fg: #e3d6a6; --night: rgba(0, 0, 0, 0.6); color-scheme: dark;
  }

  html, body { min-height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15.5px; line-height: 1.65; }

  .wrap {
    max-width: 30rem;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 18px 32px;
  }
  .screen[hidden] { display: none !important; }
  .muted { color: var(--muted); }

  .title { font-family: var(--font-title); font-size: 2.4rem; letter-spacing: 0.12em; margin: 16vh 0 10px; }
  .btn {
    font: inherit; font-weight: 700; font-size: 1.02rem;
    padding: 12px 26px; border: 0; border-radius: 6px;
    background: var(--accent); color: var(--on-accent); cursor: pointer;
  }
  .btn:focus-visible, .choice:focus-visible, .later button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  #sTitle .btn { margin-top: 24px; }

  .year { margin-top: 22vh; display: grid; gap: 10px; }
  .year .age { font-family: var(--font-title); font-size: 2.6rem; letter-spacing: 0.08em; line-height: 1.2; }
  .year .btn { justify-self: start; margin-top: 18px; }

  .status { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .status .who { font-family: var(--font-title); font-size: 1.15rem; letter-spacing: 0.06em; }
  .status .clock { font-family: var(--font-num); font-size: 1.4rem; font-variant-numeric: tabular-nums; }

  .strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px; margin: 8px 0 4px; }
  .blk { height: 30px; border-radius: 3px; background: var(--card); border: 1px solid var(--line); font-size: 0.68rem; color: var(--muted); display: grid; place-items: center; overflow: hidden; white-space: nowrap; }
  .blk.fixed { background: var(--line); color: var(--fg); }
  .blk.now { border: 2px solid var(--accent); }
  .blk.past { opacity: 0.4; }
  .times { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); font-size: 0.68rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  .scene { margin: 18px 0 14px; min-height: 6.5em; display: grid; gap: 4px; align-content: start; }
  .scene p { margin: 0; }
  .scene .k { font-family: var(--font-kid); color: var(--kid); font-size: 1.1rem; }
  .scene .old { opacity: 0.45; }

  .choices { display: grid; gap: 8px; }
  .choice {
    font: inherit; text-align: left; cursor: pointer; color: var(--fg);
    background: var(--card); border: 1.5px solid var(--line); border-radius: 8px; padding: 11px 14px;
    display: grid; gap: 0;
  }
  .choice small { color: var(--muted); font-size: 0.8rem; }
  .choice.kid { border-color: var(--kid); }
  .choice.kid b { color: var(--kid); }
  .choice:disabled { opacity: 0.5; cursor: default; }

  .later { margin-top: 22px; background: var(--note); color: var(--note-fg); border-radius: 4px; padding: 10px 14px 12px; }
  .later h2 { font-size: 0.85rem; margin: 0 0 6px; letter-spacing: 0.08em; }
  .later ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .later button {
    font: inherit; color: inherit; background: transparent; border: 0; padding: 2px 0; cursor: pointer;
    text-align: left; width: 100%; display: flex; justify-content: space-between; gap: 12px;
  }
  .later button span:last-child { opacity: 0.7; font-size: 0.8rem; white-space: nowrap; }
  .later button:disabled { cursor: default; }
  .later .empty { opacity: 0.7; font-size: 0.85rem; }
  .later .hint { opacity: 0.7; font-size: 0.75rem; margin-top: 6px; }
  .worknote { margin-top: 10px; font-size: 0.82rem; color: var(--muted); }

  .dim { position: fixed; inset: 0; background: var(--night); opacity: 0; pointer-events: none; transition: opacity 1.2s ease; z-index: 30; }
  body.dark .dim { opacity: 1; }

  .end h1 { font-family: var(--font-title); font-size: 2rem; letter-spacing: 0.12em; margin: 20px 0 18px; }
  .end section { margin-bottom: 26px; }
  .end h2 { font-size: 0.95rem; margin: 0 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .end ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .end li { display: flex; justify-content: space-between; gap: 12px; }
  .end li span:last-child { color: var(--muted); font-size: 0.82rem; white-space: nowrap; }
  .end .note { background: var(--note); color: var(--note-fg); border-radius: 4px; padding: 10px 14px; }
  .end .note h2 { border-color: transparent; }
  .end .note li span:last-child { color: inherit; opacity: 0.7; }

  .fade-in { animation: fade 0.5s ease both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .fade-in { animation: none; } .dim { transition: none; } }
</style>

<div class="dim" aria-hidden="true"></div>

<div class="wrap">
  <section class="screen" id="sTitle">
    <h1 class="title">あと何回</h1>
    <p>ハルが4歳から12歳になるまでの、ある夜たち。</p>
    <p class="muted">夜は30分ずつ進みます。空いている時間を、何に使うか選んでください。</p>
    <button type="button" class="btn" id="bStart">はじめる</button>
  </section>

  <section class="screen" id="sYear" hidden>
    <div class="year">
      <div class="age" id="yAge"></div>
      <div class="muted" id="yNote"></div>
      <button type="button" class="btn" id="bNight">夜をはじめる</button>
    </div>
  </section>

  <section class="screen" id="sPlay" hidden>
    <div class="status">
      <span class="who" id="pWho"></span>
      <span class="clock" id="pClock">18:00</span>
    </div>
    <div class="strip" id="strip"></div>
    <div class="times"><span>18:00</span><span>18:30</span><span>19:00</span><span>19:30</span><span>20:00</span><span>20:30</span></div>
    <div class="scene" id="scene" aria-live="polite"></div>
    <div class="choices" id="choices"></div>
    <div class="later" id="later">
      <h2>あとでね、と言ったこと</h2>
      <ul id="laterList"></ul>
      <div class="hint" id="laterHint" hidden>押すと、この時間をそれに使います。</div>
    </div>
    <div class="worknote" id="workNote"></div>
  </section>

  <section class="screen end" id="sEnd" hidden>
    <h1>あと何回</h1>
    <section><h2>仕事で積み上がったこと</h2><ul id="eWork"></ul></section>
    <section><h2>ハルといっしょにやったこと</h2><ul id="eDone"></ul></section>
    <section class="note"><h2>あとでね、と言ったこと</h2><ul id="eLater"></ul></section>
    <button type="button" class="btn" id="bAgain">もう一度</button>
  </section>
</div>

<script>
(function () {
  // Each night has six half-hour blocks (18:00-21:00). Fixed blocks are housework that happens on its own.
  const NIGHTS = [
    { age: 4, note: "", fixed: { 0: "夕飯", 2: "お風呂", 5: "寝かしつけ" } },
    { age: 5, note: "補助輪なしで自転車に乗れるようになった。", fixed: { 0: "夕飯", 2: "お風呂", 5: "寝かしつけ" } },
    { age: 6, note: "ひらがなが全部書けるようになった。", fixed: { 0: "夕飯", 2: "お風呂", 5: "寝かしつけ" } },
    { age: 7, note: "小学校に通いはじめて一年。", fixed: { 0: "夕飯", 2: "お風呂", 5: "寝かしつけ" } },
    { age: 8, note: "一人でお風呂に入るようになった。", fixed: { 0: "夕飯", 5: "おやすみ" } },
    { age: 10, note: "一人で寝るようになった。", fixed: { 0: "夕飯" } },
    { age: 12, note: "中学の制服を買った。", fixed: { 0: "夕飯" }, roomFrom: 4 }
  ];

  // ask: ages the child asks it. until: the last age it can still happen.
  const REQS = [
    { id: "dakko", ask: [4, 5], until: 5, say: "だっこ", again: "ねえ、だっこは？", act: "抱っこする", label: "だっこ",
      ok: "抱きあげる。重い。しばらく下ろさない。", late: "「え、いいよ。重いでしょ」" },
    { id: "ehon", ask: [4, 6], until: 6, say: "この絵本よんで", again: "絵本、まだ？", act: "絵本を読む", label: "絵本を読む",
      ok: "読む。もう一回と言われて、もう一回。", late: "「それ、もう読まないよ」" },
    { id: "inu", ask: [4, 5], until: 5, say: "見て、犬かいた", again: "犬の絵、見た？", act: "絵を見る", label: "犬の絵を見る",
      ok: "茶色の犬。しっぽがない。「しっぽはあしたかく」", late: "「犬？ どの絵？」" },
    { id: "neru", ask: [4, 7], until: 7, say: "きょういっしょにねて", again: "ねえ、いっしょにねてくれる？", act: "いっしょに寝る", label: "いっしょに寝る",
      ok: "狭いベッドで、背中をくっつけて寝る。", late: "「ひとりで寝れるってば」" },
    { id: "sakaagari", ask: [6, 7], until: 7, say: "さかあがり、見て。こんど公園で", again: "公園、いつ行く？", act: "公園に行く", label: "公園でさかあがりを見る",
      ok: "暗くなりかけの公園。三回目で回った。", late: "「さかあがり？ もう普通にできるよ」" },
    { id: "game", ask: [8, 10], until: 10, say: "このゲーム、いっしょにやろ", again: "ゲーム、やらないの？", act: "ゲームをする", label: "いっしょにゲーム",
      ok: "負ける。もう一回と言って、また負ける。", late: "「あー、それもうやってない」" },
    { id: "tsuri", ask: [8, 10], until: 12, say: "こんど釣りに行きたい", again: "釣りの話、覚えてる？", act: "釣りの計画を立てる", label: "釣りに行く",
      ok: "次の日曜、釣りに行く約束をした。地図を二人で見る。", late: "" },
    { id: "hanashi", ask: [10, 12], until: 12, say: "ちょっと話があるんだけど", again: "……やっぱりいい", act: "話を聞く", label: "話を聞く",
      ok: "部屋の床に座って、友だちのことを聞く。", late: "" }
  ];

  const WORK = [
    ["資料をつくる", "資料をつくった。"],
    ["メールを返す", "メールを返した。"],
    ["企画書を直す", "企画書を直した。"],
    ["見積もりを出す", "見積もりを出した。"],
    ["来週の準備をする", "来週の準備をした。"]
  ];
  const WORK_MILESTONES = [
    [2, "見積もりを一人で出せるようになった"],
    [4, "後輩がついた"],
    [6, "小さな案件を任された"],
    [9, "チームを持った"],
    [12, "大きな案件がまとまった"],
    [15, "名前で指名されるようになった"],
    [18, "新しい部署を任された"]
  ];
  const REST = "スマホを見る。十五分のつもりが、三十分。";

  const $ = (id) => document.getElementById(id);
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  let ni, slot, work, workLog, later, done, current, locked, tonight;

  const night = () => NIGHTS[ni];
  const age = () => night().age;
  const clockOf = (s) => { const m = 18 * 60 + s * 30; return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); };
  const inRoom = () => night().roomFrom != null && slot >= night().roomFrom;

  function show(id) { ["sTitle", "sYear", "sPlay", "sEnd"].forEach((s) => { $(s).hidden = s !== id; }); window.scrollTo(0, 0); }

  function say(text, kid) {
    const sc = $("scene");
    sc.querySelectorAll("p").forEach((p) => p.classList.add("old"));
    while (sc.children.length > 3) sc.removeChild(sc.firstChild);
    const p = document.createElement("p");
    p.className = (kid ? "k " : "") + "fade-in";
    p.textContent = text;
    sc.appendChild(p);
  }

  function renderStrip() {
    const st = $("strip");
    st.innerHTML = "";
    for (let i = 0; i < 6; i++) {
      const b = document.createElement("div");
      const f = night().fixed[i];
      b.className = "blk" + (f ? " fixed" : "") + (i === slot ? " now" : "") + (i < slot ? " past" : "");
      b.textContent = f || "";
      st.appendChild(b);
    }
    $("pClock").textContent = clockOf(Math.min(slot, 6));
  }

  function renderLater(interactive) {
    const ul = $("laterList");
    ul.innerHTML = "";
    $("laterHint").hidden = !(interactive && later.length);
    if (!later.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "まだない";
      ul.appendChild(li);
      return;
    }
    later.forEach((item) => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button";
      b.disabled = !interactive;
      b.innerHTML = "<span></span><span></span>";
      b.children[0].textContent = item.req.label;
      b.children[1].textContent = item.age + "歳のとき";
      b.addEventListener("click", () => choose({ kind: "later", item }));
      li.appendChild(b);
      ul.appendChild(li);
    });
  }

  function renderWork() {
    const latest = workLog[workLog.length - 1];
    $("workNote").textContent = "仕事：" + (latest || "まだこれから");
  }

  function eligibleReq() {
    const a = age();
    if (inRoom()) return null;
    const chance = a <= 7 ? 1 : a <= 8 ? 0.85 : a <= 10 ? 0.65 : 0.5;
    if (Math.random() > chance) return null;
    const pool = REQS.filter((r) => a >= r.ask[0] && a <= r.ask[1] && !tonight.has(r.id));
    if (!pool.length) return null;
    const notPending = pool.filter((r) => !later.some((l) => l.req.id === r.id));
    return pick(notPending.length && Math.random() < 0.7 ? notPending : pool);
  }

  function button(html, cls, onClick) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "choice" + (cls ? " " + cls : "");
    b.innerHTML = html;
    b.addEventListener("click", onClick);
    return b;
  }

  function fixedLine(f) {
    if (f === "夕飯") return age() >= 10 ? "夕飯。ハルはおかわりをする。" : "夕飯をつくって、食べさせる。";
    if (f === "お風呂") return "お風呂に入れる。";
    if (f === "寝かしつけ") return "寝かしつける。";
    if (f === "おやすみ") return "「おやすみ」";
    return f + "。";
  }

  async function nextSlot() {
    locked = false;
    renderStrip();
    if (slot >= 6) return endNight();

    const fixed = night().fixed[slot];
    const box = $("choices");
    box.innerHTML = "";
    if (fixed) {
      renderLater(false);
      say(fixedLine(fixed));
      await wait(reduce ? 500 : 1500);
      slot += 1;
      return nextSlot();
    }

    current = eligibleReq();
    if (current) {
      const pending = later.some((l) => l.req.id === current.id);
      say("「" + (pending ? current.again : current.say) + "」", true);
      box.appendChild(button("<b>" + esc(current.act) + "</b>", "kid", () => choose({ kind: "req" })));
    } else if (inRoom()) {
      say("ハルは部屋にいる。");
    } else {
      say(age() >= 10 ? "ハルはソファでスマホを見ている。" : "ハルはひとりで遊んでいる。");
    }
    const w = WORK[work % WORK.length][0];
    box.appendChild(button("<b>仕事をする</b><small>" + esc(w) + "</small>", "", () => choose({ kind: "work" })));
    box.appendChild(button("<b>少し休む</b>", "", () => choose({ kind: "rest" })));
    renderLater(true);
  }

  async function choose(c) {
    if (locked) return;
    locked = true;
    $("choices").querySelectorAll("button").forEach((b) => { b.disabled = true; });
    renderLater(false);

    const answersCurrent = c.kind === "req" || (c.kind === "later" && current && c.item.req.id === current.id);
    const deferred = current && !answersCurrent;
    if (deferred) { say("「あとでね」"); await wait(reduce ? 200 : 700); }

    if (c.kind === "req") {
      say(current.ok);
      done.push({ label: current.label, age: age() });
      tonight.add(current.id);
      later = later.filter((l) => l.req.id !== current.id);
    } else if (c.kind === "work") {
      say(WORK[work % WORK.length][1]);
      work += 1;
      const m = WORK_MILESTONES.find(([n]) => n === work);
      if (m) { workLog.push(m[1]); await wait(reduce ? 200 : 600); say(m[1] + "。"); }
    } else if (c.kind === "rest") {
      say(REST);
    } else if (c.kind === "later") {
      const item = c.item;
      later = later.filter((l) => l !== item);
      if (age() <= item.req.until) {
        say(item.req.ok);
        done.push({ label: item.req.label, age: age() });
        tonight.add(item.req.id);
      } else {
        say(item.req.late, true);
      }
    }

    if (deferred && !later.some((l) => l.req.id === current.id)) later.push({ req: current, age: age() });
    current = null;
    renderLater(false);
    renderWork();
    await wait(reduce ? 400 : 1700);
    slot += 1;
    nextSlot();
  }

  async function endNight() {
    $("choices").innerHTML = "";
    say(age() >= 10 ? "今日も終わった。" : "寝息が聞こえる。今日も終わった。");
    await wait(reduce ? 600 : 1800);
    document.body.classList.add("dark");
    await wait(reduce ? 0 : 1300);
    ni += 1;
    if (ni < NIGHTS.length) openYear();
    else showEnd();
    document.body.classList.remove("dark");
  }

  function openYear() {
    $("yAge").textContent = "ハル " + age() + "歳";
    $("yNote").textContent = night().note;
    show("sYear");
  }

  function startNight() {
    slot = 0;
    tonight = new Set();
    $("scene").innerHTML = "";
    $("pWho").textContent = "ハル " + age() + "歳";
    renderWork();
    show("sPlay");
    nextSlot();
  }

  function fill(id, rows, empty) {
    const ul = $(id);
    ul.innerHTML = "";
    if (!rows.length) rows = [[empty, ""]];
    rows.forEach(([l, r]) => {
      const li = document.createElement("li");
      li.innerHTML = "<span></span><span></span>";
      li.children[0].textContent = l;
      li.children[1].textContent = r;
      ul.appendChild(li);
    });
  }

  function showEnd() {
    fill("eWork", workLog.map((w) => [w, ""]).concat([["仕事に使った夜の時間", work * 30 + "分"]]), "なし");
    fill("eDone", done.map((d) => [d.label, d.age + "歳"]), "なし");
    fill("eLater", later.map((l) => [l.req.label, l.age + "歳のとき"]), "なし");
    show("sEnd");
  }

  function reset() {
    ni = 0; work = 0; workLog = []; later = []; done = []; current = null; locked = false;
    show("sTitle");
  }

  $("bStart").addEventListener("click", openYear);
  $("bNight").addEventListener("click", startNight);
  $("bAgain").addEventListener("click", reset);
  reset();
})();
</script>
