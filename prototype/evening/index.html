<title>あと何回</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho:wght@500;700&display=swap">
<style>
  /* Layout: one narrow column like a notebook page; each evening opens with a dated heading, the log runs down the page, one action sits at the bottom. */
  :root {
    --bg: #eef1ef;
    --fg: #22302c;
    --muted: #6b7a75;
    --line: #c9d2ce;
    --kid: #3b5794;
    --other: #7a5a3c;
    --accent: #2f6a5d;
    --on-accent: #f4f7f6;
    --night: rgba(18, 28, 40, 0.5);
    --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    --font-kid: "Klee One", "Hiragino Maru Gothic ProN", "Zen Kaku Gothic New", sans-serif;
    --font-title: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151b1a;
      --fg: #dce4e1;
      --muted: #8d9c97;
      --line: #2f3b38;
      --kid: #a3b8ea;
      --other: #d2b08c;
      --accent: #6fb2a2;
      --on-accent: #0f1715;
      --night: rgba(0, 0, 0, 0.55);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151b1a;
    --fg: #dce4e1;
    --muted: #8d9c97;
    --line: #2f3b38;
    --kid: #a3b8ea;
    --other: #d2b08c;
    --accent: #6fb2a2;
    --on-accent: #0f1715;
    --night: rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }

  html, body { min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.75;
  }

  .dim {
    position: fixed;
    inset: 0;
    background: var(--night);
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.6s ease;
    z-index: 30;
  }
  body.dark .dim { opacity: 1; }

  .wrap {
    position: relative;
    max-width: 34rem;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 28px 9rem;
  }

  .title {
    font-family: var(--font-title);
    font-weight: 700;
    font-size: 2.4rem;
    letter-spacing: 0.12em;
    line-height: 1.3;
    margin: 18vh 0 12px;
  }
  .lead { color: var(--muted); margin: 0; }

  .log { display: grid; gap: 6px; }
  .log p { margin: 0; min-width: 0; }
  .log .day {
    margin-top: 40px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 0 14px;
    align-items: baseline;
  }
  .log .day:first-child { margin-top: 0; }
  .log .day b { font-family: var(--font-title); font-size: 1.25rem; letter-spacing: 0.06em; }
  .log .day span { color: var(--muted); font-size: 0.85rem; }
  .log .work { color: var(--muted); font-size: 0.85rem; margin-bottom: 6px; }
  .log .kid { font-family: var(--font-kid); font-weight: 600; color: var(--kid); padding-left: 1.2em; }
  .log .other { color: var(--other); padding-left: 1.2em; }
  .log .past { opacity: 0.45; }

  .act {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 6;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: 12px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, var(--bg) 70%, transparent);
    display: flex;
    justify-content: center;
  }
  .act[hidden] { display: none !important; }
  .act button, .again {
    font: inherit;
    font-weight: 700;
    font-size: 1.05rem;
    min-width: 12rem;
    padding: 14px 28px;
    border: 0;
    border-radius: 6px;
    background: var(--accent);
    color: var(--on-accent);
    cursor: pointer;
    touch-action: manipulation;
  }
  .act button:disabled { opacity: 0.45; cursor: default; }
  .act button:focus-visible, .again:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  .reveal { display: grid; gap: 36px; }
  .reveal[hidden] { display: none !important; }
  .reveal h2 {
    font-family: var(--font-title);
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: 0.08em;
    margin: 0 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }
  .reveal ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .reveal li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: baseline; }
  .reveal li span:last-child { color: var(--muted); font-size: 0.85rem; text-align: right; white-space: nowrap; }
  @media (max-width: 420px) {
    .reveal li { grid-template-columns: minmax(0, 1fr); }
    .reveal li span:last-child { text-align: left; }
  }
  .reveal .end { display: flex; justify-content: center; padding-top: 12px; }

  .fade-in { animation: fade 0.6s ease both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .fade-in { animation: none; }
    .dim { transition: none; }
  }
</style>

<div class="dim" aria-hidden="true"></div>

<div class="wrap">
  <section id="intro">
    <h1 class="title">あと何回</h1>
    <p class="lead">ハル、4歳。ある年の、ふつうの夜から。</p>
  </section>

  <main>
    <div class="log" id="log" aria-live="polite"></div>
    <section class="reveal" id="reveal" hidden></section>
  </main>
</div>

<div class="act" id="act">
  <button type="button" id="go">はじめる</button>
</div>

<script>
(function () {
  // Step syntax: optional "[moment]" tag, then "k:" child, "o:" partner, "w:" work, or plain = the player's own action.
  const MOMENTS = {
    okaeri: "走ってきて「おかえり」と言う",
    dakko: "抱っこをせがむ",
    te: "手をつないで歩く",
    ehon: "絵本を読んでもらう",
    furo: "いっしょにお風呂に入る",
    soine: "隣で寝る",
    mite: "「ねえ見て」と呼ぶ",
    soudan: "相談してくる"
  };
  const STARTED = ["soudan"];

  const NIGHTS = [
    { age: 4, date: "10月の水曜日", grow: null, work: "はじめて一人で客先に行った。", steps: [
      "玄関をあける。",
      "[okaeri]k:おかえり！",
      "走ってきて、足にしがみつかれる。",
      "[dakko]k:だっこ",
      "抱きあげたまま、片手で鞄を置く。",
      "夕飯をつくる。",
      "[mite]k:ねえ見て、ダンゴムシ",
      "「手を洗ってきて」",
      "[furo]いっしょにお風呂に入る。",
      "k:あわあわして",
      "泡を立てる。",
      "[ehon]絵本を読む。同じ本を二回。",
      "[soine]隣で横になる。",
      "k:あしたもいっしょにねる？",
      "「うん。もう寝よう」",
      "寝息が聞こえる。"
    ]},
    { age: 5, date: "6月の金曜日", grow: "補助輪なしで自転車に乗れる", work: "見積もりを一人で出せるようになった。", steps: [
      "玄関をあける。",
      "[okaeri]k:おかえり！ ねえ、補助輪なしで乗れたんだよ",
      "「ほんと？」",
      "[dakko]k:だっこして、つかれた",
      "「重くなったなあ」",
      "夕飯をつくる。",
      "o:ただいま。はー、今日も終わった",
      "食べさせる。",
      "[te]ゴミ出しについてくる。手をつなぐ。",
      "[furo]いっしょにお風呂に入る。",
      "[ehon]絵本を読む。",
      "[soine]隣で横になる。",
      "[mite]k:ねえ見て、足の指、ぜんぶうごく",
      "「見た見た。寝なさい」",
      "寝息が聞こえる。"
    ]},
    { age: 6, date: "1月の月曜日", grow: "名前をひらがなで書ける", work: "後輩がついた。教えることが増えた。", steps: [
      "玄関をあける。",
      "[okaeri]k:おかえりー",
      "走ってきて、ぶつかる。",
      "k:なまえ、ぜんぶひらがなでかけた",
      "冷蔵庫に貼ってある紙を見る。",
      "[dakko]k:だっこ",
      "「ちょっとだけね」",
      "少しだけ抱きあげて、すぐ下ろす。",
      "夕飯をつくる。",
      "片付ける。",
      "[furo]いっしょにお風呂に入る。",
      "[ehon]絵本を読む。今日は一回だけ。",
      "[soine]隣で横になる。",
      "k:あした、がっこうの見学いくんだよ",
      "寝息が聞こえる。"
    ]},
    { age: 7, date: "9月の木曜日", grow: "さかあがりができる", work: "小さな案件を任された。", steps: [
      "玄関をあける。",
      "[okaeri]k:おかえり！ さかあがり、できた！",
      "「見せて」",
      "k:あした公園で見せる",
      "夕飯をつくる。",
      "宿題を見る。",
      "[mite]k:ねえ見て、この漢字、かっこよくない？",
      "[furo]いっしょにお風呂に入る。",
      "[ehon]k:これよんで",
      "絵本を読む。途中から、自分で読みはじめる。",
      "[soine]隣で横になる。",
      "[te]k:て、つないでて",
      "手をつないだまま、スマホでメールを返す。",
      "寝息が聞こえる。"
    ]},
    { age: 8, date: "3月の火曜日", grow: "九九が全部言える", work: "チームを持った。", steps: [
      "玄関をあける。",
      "k:おかえりー",
      "リビングから声だけ。",
      "k:くくのテスト、ぜんぶ言えた",
      "「すごい」",
      "夕飯をつくる。",
      "o:今日も終わったね。あとで一杯飲もう",
      "片付ける。",
      "[furo]いっしょにお風呂に入る。",
      "k:さんぱにじゅうし、さんくにじゅうしち",
      "[soine]隣で、少しだけ横になる。",
      "[mite]k:ねえ見て、歯がぐらぐら",
      "「あした抜けるかもね」",
      "寝息が聞こえる。"
    ]},
    { age: 9, date: "7月の土曜日", grow: "一人で留守番ができる", work: "大きな案件がまとまった。", steps: [
      "夕方、帰る。",
      "k:おかえり。きょう一人で留守番したよ",
      "「えらいね」",
      "[te]夜、コンビニまでアイスを買いに行く。手をつなぐ。",
      "k:どれにしよう",
      "夕飯をつくる。",
      "k:きょうは一人で入る",
      "お風呂の外で、洗い物をしながら待つ。",
      "[mite]k:ねえ見て、日焼けのあと",
      "「おやすみ」",
      "部屋の電気を消す。",
      "k:おやすみ"
    ]},
    { age: 10, date: "12月の水曜日", grow: "目玉焼きをつくれる", work: "名前で指名されるようになった。", steps: [
      "玄関をあける。",
      "k:おかえり",
      "ソファでゲームをしている。",
      "k:目玉焼き、自分でつくれるよ。食べる？",
      "食べる。少し焦げている。",
      "夕飯をつくる。",
      "宿題を見る。",
      "k:いい、自分でやる",
      "[mite]k:ねえ見て、この動画",
      "「あとでね」",
      "片付ける。",
      "k:おやすみー"
    ]},
    { age: 11, date: "5月の金曜日", grow: "電車で一人で出かけられる", work: "新しい部署の立ち上げを頼まれた。", steps: [
      "玄関をあける。",
      "k:……おかえり",
      "ヘッドホンを片耳だけ外す。",
      "夕飯をつくる。",
      "k:日曜、友だちと電車で出かけていい？",
      "「どこまで？」",
      "k:二駅。一人で行ける",
      "o:いいんじゃない。……はー、今日も終わった",
      "片付ける。",
      "部屋の前を通る。",
      "[soudan]k:ねえ、ちょっと相談があるんだけど",
      "話を聞く。友だちのこと。",
      "k:おやすみ"
    ]},
    { age: 12, date: "2月の水曜日", grow: "中学の制服を着る", work: "来年の計画を、自分で書いている。", steps: [
      "玄関をあける。",
      "k:おかえり",
      "部屋のドアが少しあいている。",
      "夕飯をつくる。",
      "三人で食べる。",
      "k:きょう、制服の採寸したよ",
      "「見たかったな」",
      "片付ける。",
      "[soudan]k:ねえ、ちょっといい？",
      "話を聞く。",
      "o:はー、今日も終わった",
      "k:おやすみ",
      "ドアが閉まる。"
    ]}
  ];

  const $ = (id) => document.getElementById(id);
  const log = $("log"), go = $("go"), act = $("act"), reveal = $("reveal"), intro = $("intro");
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let ni, si, busy, seen;

  function parse(raw) {
    let tag = null, s = raw;
    const m = s.match(/^\[(\w+)\]/);
    if (m) { tag = m[1]; s = s.slice(m[0].length); }
    let kind = "me";
    if (s.startsWith("k:")) kind = "kid";
    else if (s.startsWith("o:")) kind = "other";
    else if (s.startsWith("w:")) kind = "work";
    if (kind !== "me") s = s.slice(2);
    return { tag, kind, text: s };
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function scrollDown() {
    window.scrollTo({ top: document.documentElement.scrollHeight, behavior: reduce ? "auto" : "smooth" });
  }

  function show(step) {
    const p = step.kind === "kid" || step.kind === "other"
      ? el("p", step.kind + " fade-in", "「" + step.text + "」")
      : el("p", "fade-in", step.text);
    log.appendChild(p);
    if (step.tag) (seen[step.tag] = seen[step.tag] || []).push(ni);
    scrollDown();
  }

  function openNight() {
    const n = NIGHTS[ni];
    log.querySelectorAll("p:not(.past)").forEach((p) => p.classList.add("past"));
    const head = el("p", "day fade-in");
    head.appendChild(el("b", null, "ハル " + n.age + "歳"));
    head.appendChild(el("span", null, n.date));
    log.appendChild(head);
    log.appendChild(el("p", "work fade-in", "仕事：" + n.work));
    scrollDown();
  }

  const isAuto = (raw) => raw && parse(raw).kind !== "me";

  async function tap() {
    if (busy) return;
    busy = true;
    go.disabled = true;

    const n = NIGHTS[ni];
    show(parse(n.steps[si]));
    si += 1;
    while (si < n.steps.length && isAuto(n.steps[si])) {
      await wait(750);
      show(parse(n.steps[si]));
      si += 1;
    }
    await wait(250);

    if (si >= n.steps.length) {
      await wait(900);
      if (ni + 1 < NIGHTS.length) {
        if (!reduce) { document.body.classList.add("dark"); await wait(1700); }
        ni += 1;
        si = 0;
        openNight();
        document.body.classList.remove("dark");
        await wait(reduce ? 0 : 900);
      } else {
        await ending();
        return;
      }
    }
    busy = false;
    go.disabled = false;
    go.textContent = "つづける";
  }

  function row(left, right) {
    const li = el("li");
    li.appendChild(el("span", null, left));
    li.appendChild(el("span", null, right));
    return li;
  }

  function section(title, items) {
    const s = el("section");
    s.appendChild(el("h2", null, title));
    const ul = el("ul");
    items.forEach((li) => ul.appendChild(li));
    s.appendChild(ul);
    return s;
  }

  async function ending() {
    act.hidden = true;
    document.body.classList.add("dark");
    await wait(2400);

    const label = (i) => NIGHTS[i].age + "歳、" + NIGHTS[i].date;
    const lasts = [], begun = [];
    Object.keys(MOMENTS).forEach((k) => {
      const hits = seen[k] || [];
      if (!hits.length) return;
      const last = hits[hits.length - 1];
      if (STARTED.includes(k)) begun.push(row(MOMENTS[k], NIGHTS[hits[0]].age + "歳から"));
      else lasts.push({ k, last });
    });
    lasts.sort((a, b) => a.last - b.last);

    reveal.innerHTML = "";
    reveal.appendChild(section("増えていったこと", NIGHTS.map((n) => row(n.work, n.age + "歳のころ"))));
    reveal.appendChild(section("ハルができるようになったこと", NIGHTS.filter((n) => n.grow).map((n) => row(n.grow, n.age + "歳"))));
    reveal.appendChild(section("最後だったこと", lasts.map(({ k, last }) => row(MOMENTS[k], "最後は " + label(last)))));
    reveal.appendChild(section("始まったこと", begun));
    const end = el("div", "end");
    const again = el("button", "again", "もう一度");
    again.type = "button";
    again.addEventListener("click", reset);
    end.appendChild(again);
    reveal.appendChild(end);

    log.hidden = true;
    reveal.hidden = false;
    window.scrollTo(0, 0);
    document.body.classList.remove("dark");
  }

  async function begin() {
    intro.hidden = true;
    go.onclick = tap;
    openNight();
    busy = false;
    go.disabled = false;
    go.textContent = "つづける";
  }

  function reset() {
    ni = 0; si = 0; busy = false; seen = {};
    log.innerHTML = "";
    log.hidden = false;
    reveal.hidden = true;
    reveal.innerHTML = "";
    intro.hidden = false;
    act.hidden = false;
    go.disabled = false;
    go.textContent = "はじめる";
    go.onclick = begin;
    document.body.classList.remove("dark");
    window.scrollTo(0, 0);
  }

  reset();
})();
</script>
